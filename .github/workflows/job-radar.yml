name: Job Radar

on:
  workflow_dispatch:
  schedule:
    # 11:00 UTC = 08:00 em São Paulo durante o horário padrão atual
    - cron: '0 11 * * 1,3,5'

permissions:
  contents: write

jobs:
  search-build-notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python src/search_jobs.py
      - run: python src/build_dashboard.py
      - name: Send optional email alert
        continue-on-error: true
        run: python src/send_email.py
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
      - name: Commit updated database and dashboard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/jobs.sqlite docs/
          git diff --cached --quiet || git commit -m 'update job radar'
          git push
